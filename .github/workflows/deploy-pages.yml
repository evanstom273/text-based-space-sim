name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify live build ID
        env:
          EXPECTED_BUILD: ${{ github.sha }}
          SITE_URL: https://evanstom273.github.io/text-based-space-sim/
        run: |
          set -euo pipefail
          target="${EXPECTED_BUILD:0:7}"
          for attempt in 1 2 3 4 5 6; do
            sleep 10
            html="$(curl -fsSL "$SITE_URL")"
            live="$(printf '%s' "$html" | sed -n 's/.*name="build-id" content="\([^"]*\)".*/\1/p' | head -n 1)"
            if [ "$live" = "$target" ]; then
              echo "Live site verified: BLD $live"
              exit 0
            fi
            echo "Attempt $attempt: live='$live' expected='$target'"
          done
          echo "Deploy verification failed after 60s"
          exit 1
